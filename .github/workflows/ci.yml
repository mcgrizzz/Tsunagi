name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    # Kiso's add-on CI: ruff and the suite on the newest Anki and on 26.8.1 (the
    # oldest supported, on the Python it requires), the real-Anki checks, the
    # build (pure-Python only), and pip-audit on the vendored web stack
    # (advisories that don't apply are in pyproject.toml's audit_ignore). Anki's
    # deprecation notices for Tsunagi's own calls fail the run.
    uses: mcgrizzz/Kiso/.github/workflows/addon-ci.yml@main
    with:
      floor-anki: "26.8.1"
      qt-checks: tools/qt_checks.sh
      test-packages: httpx

  client:
    # The clients move with the API (packages/<language>). TypeScript: its own
    # tests, including the check against tests/snapshots/openapi.json, then the
    # built client against the real server (tests/test_typescript_client.py).
    name: TypeScript client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Client tests
        working-directory: packages/typescript
        run: npm ci && npm test
      - uses: mcgrizzz/Kiso@main
      - name: Test packages
        run: python -m pip install -q httpx
      - name: Against the server
        run: python -m pytest -q -rs tests/test_typescript_client.py
