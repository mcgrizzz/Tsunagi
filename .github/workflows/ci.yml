name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    # Kiso's add-on CI: ruff and the suite on the newest Anki and on 26.8.1 (the
    # oldest supported, on the Python it requires), the real-Anki checks, the
    # build (pure-Python only), and pip-audit on the vendored web stack
    # (advisories that don't apply are in pyproject.toml's audit_ignore). Anki's
    # deprecation notices for Tsunagi's own calls fail the run.
    uses: mcgrizzz/Kiso/.github/workflows/addon-ci.yml@main
    with:
      floor-anki: "26.8.1"
      qt-checks: tools/qt_checks.sh
      test-packages: httpx
