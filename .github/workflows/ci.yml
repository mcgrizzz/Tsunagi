name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tsunagi supports the current Anki release and the one before it.
        # The floor leg pins the oldest supported Anki on the Python it
        # requires, proving we call nothing newer; the current leg runs the
        # newest release on the Python that Anki's launcher ships.
        include:
          - python-version: "3.10"
            anki-version: "==26.8.1"
          - python-version: "3.13"
            anki-version: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache wheelhouse
        uses: actions/cache@v6
        with:
          path: .wheelhouse
          key: wheelhouse-${{ hashFiles('tools/requirements.lock.txt') }}

      - name: Install dev tools
        # anki is test-only: the suite runs against a real headless collection.
        # It is deliberately NOT in tools/requirements.lock.txt, so it can never
        # be vendored into the artifact.
        run: python -m pip install pytest ruff "httpx<0.28" "anki${{ matrix.anki-version }}"

      - name: Build addon (vendors lib/shared)
        run: python tools/build_addon.py

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Build smoke (artifact exists, pure-Python, deps importable)
        run: |
          python - <<'EOF'
          import pathlib, sys, zipfile
          zips = sorted(pathlib.Path("dist").glob("tsunagi-*.ankiaddon"))
          assert zips, "no addon zip built"
          names = zipfile.ZipFile(zips[-1]).namelist()
          bad = [n for n in names if n.endswith((".pyd", ".so", ".dylib", ".pyc"))]
          assert not bad, f"compiled/bytecode files in artifact: {bad}"
          sys.path.insert(0, "lib/shared")
          import fastapi, pydantic, starlette, uvicorn  # noqa: F401
          assert pydantic.VERSION == "1.10.22", pydantic.VERSION
          print("smoke OK:", zips[-1].name, len(names), "files")
          EOF

  qt:
    uses: ./.github/workflows/qt.yml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Audit vendored dependencies
        # Each ignored advisory is unreachable in Tsunagi today; recheck it when
        # the named feature starts being used. Any other advisory fails CI.
        run: |
          python -m pip install -q pip-audit
          ignore=(
            # starlette form parsing (CVE-2024-47874, CVE-2025-54121, CVE-2026-54283):
            # Tsunagi parses no forms and python-multipart is not vendored. Backlog 7.5.
            PYSEC-2026-1943 PYSEC-2026-1941 PYSEC-2026-249
            # starlette request.url rebuilt from Host/path (CVE-2026-48710, CVE-2026-54282):
            # auth and routing read scope["path"]; the Host header is validated first.
            PYSEC-2026-161 PYSEC-2026-248
            # starlette StaticFiles on Windows (CVE-2026-48818), HTTPEndpoint methods
            # (CVE-2026-48817): neither is used.
            PYSEC-2026-2281 PYSEC-2026-2280
            # click.edit() (CVE-2026-7246): only uvicorn's CLI uses click; never called.
            PYSEC-2026-2132
            # anyio TLS client and process pools (CVE-2026-63374, CVE-2026-64847): the
            # server uses neither.
            CVE-2026-63374 CVE-2026-64847
            # idna.encode() (CVE-2026-45409): only anyio's client connect path calls it.
            PYSEC-2026-215
          )
          args=()
          for id in "${ignore[@]}"; do args+=(--ignore-vuln "$id"); done
          pip-audit -r tools/requirements.lock.txt --disable-pip --no-deps "${args[@]}"
