name: Client publish

# Stages the TypeScript client (packages/typescript) on npm as tsunagi-client.
# A client's major.minor is the add-on's (the API it speaks); its patch is its
# own. Two ways in:
#   - an add-on release (tag v0.7.0) stages the client at that tag, which must
#     share the release's major.minor;
#   - a client-only release (tag client-v0.6.1, pushed by hand) stages that
#     version, if the API description at the tag matches the newest add-on
#     release of the same major.minor apart from wording
#     (tools/client_api_matches.py), so the client never needs an unreleased API.
# Tested first, with provenance. npm trusts this workflow file (trusted
# publishing, staged only): the version goes live when a maintainer approves it
# on npmjs.com with 2FA. A version npm already has is skipped. Run it by hand
# with either kind of tag to stage it again.

on:
  release:
    types: [published]
  push:
    tags: ["client-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag (v0.7.0) or a client tag (client-v0.6.1)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports staged trusted publishing
        run: npm install -g npm@latest
      - name: Check the version, skip it if npm has it
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          minor="${version%.*}"
          case "$TAG" in
            client-v*)
              if [ "client-v$version" != "$TAG" ]; then
                echo "packages/typescript is $version, the tag is $TAG" >&2; exit 1
              fi
              addon="$(git tag --list "v$minor.*" --sort=-v:refname | head -n 1)"
              if [ -z "$addon" ]; then
                echo "No add-on release v$minor.x for client $version" >&2; exit 1
              fi
              python3 ../../tools/client_api_matches.py "$addon"
              ;;
            v*)
              release="${TAG#v}"
              if [ "$minor" != "${release%.*}" ]; then
                echo "packages/typescript is $version, the release is $TAG: major.minor must match" >&2; exit 1
              fi
              ;;
            *)
              echo "Not a release or client tag: $TAG" >&2; exit 1
              ;;
          esac
          if npm view "tsunagi-client@$version" version >/dev/null 2>&1; then
            echo "npm already has tsunagi-client $version; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## $version " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version (## $version (date))" >&2; exit 1
          fi
      - if: steps.version.outputs.skip != 'true'
        run: npm ci
      - if: steps.version.outputs.skip != 'true'
        run: npm test
      - name: Stage it; approve it on npmjs.com to publish
        if: steps.version.outputs.skip != 'true'
        run: npm stage publish . --provenance
