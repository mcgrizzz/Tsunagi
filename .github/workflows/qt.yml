name: Qt checks

# Offscreen Qt tests and real-Anki GUI checks. CI runs them on the newest
# Anki; the Anki watch passes the version it is testing.
on:
  workflow_call:
    inputs:
      anki-version:
        description: pip version specifier for aqt, e.g. "==26.9.3"; empty means the newest release
        type: string
        default: ""

permissions:
  contents: read

jobs:
  qt:
    # Pinned: the apt package names below are specific to this release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libxkbfile1 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 \
            libdbus-1-3 libfontconfig1 libpulse0

      - name: Install Anki with Qt
        run: python -m pip install pytest "httpx<0.28" "aqt[qt6]${{ inputs.anki-version }}"

      - name: Build addon (vendors lib/shared)
        run: python tools/build_addon.py

      - name: Qt checks
        run: tools/qt_checks.sh
