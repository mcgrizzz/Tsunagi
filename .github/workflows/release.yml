name: Release

# A tag v1.2.3 matching pyproject.toml's version, or a manual run on main
# (which tags v<version>), runs CI, then attaches the .ankiaddon and its .sha256
# to a draft release titled "Tsunagi <version>". A published release keeps its
# files. Replace the draft's body with dist/release-notes-<version>.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    permissions:
      contents: write
    uses: mcgrizzz/Kiso/.github/workflows/addon-release.yml@main
    with:
      title: Tsunagi
